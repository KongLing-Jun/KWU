name: Nightly Go regression

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-go-regression
  cancel-in-progress: true

jobs:
  root-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Root Go regression
        env:
          KWU_RELEASE_CACHE_GUARD: "1"
        run: |
          go vet ./...
          go test ./...

  desktop-go:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Desktop Go regression
        working-directory: desktop
        run: |
          go vet ./...
          go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Frontend regression
        working-directory: desktop/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test:all
          pnpm build
