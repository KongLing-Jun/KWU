name: CI

on:
  push:
    branches: [main-v3]
  pull_request:
    branches: [main-v3]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      base_ref: ${{ steps.scope.outputs.base_ref }}
      root_go_mode: ${{ steps.scope.outputs.root_go_mode }}
      desktop_go_mode: ${{ steps.scope.outputs.desktop_go_mode }}
      frontend_mode: ${{ steps.scope.outputs.frontend_mode }}
      release_contract: ${{ steps.scope.outputs.release_contract }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed surfaces
        id: scope
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$EVENT_BASE"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          echo "base_ref=$base" >> "$GITHUB_OUTPUT"
          node scripts/pr-gate.mjs \
            --base "$base" \
            --head "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

  guard:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Common PR guards
        run: node scripts/pr-gate.mjs --base "${{ needs.scope.outputs.base_ref }}" --run common

  test:
    needs: [scope, guard]
    if: needs.scope.outputs.root_go_mode != 'none'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        if: runner.os != 'Windows'
        shell: bash
        run: |
          unformatted=$(gofmt -l . | grep -v '^desktop/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Proportional root Go gate
        run: node scripts/pr-gate.mjs --base "${{ needs.scope.outputs.base_ref }}" --run root-go

  race:
    needs: [scope, guard]
    if: needs.scope.outputs.root_go_mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Full core race regression
        env:
          KWU_RELEASE_CACHE_GUARD: "1"
        run: go test -race ./...

  desktop:
    needs: [scope, guard]
    if: >-
      needs.scope.outputs.desktop_go_mode != 'none' ||
      needs.scope.outputs.frontend_mode != 'none' ||
      needs.scope.outputs.release_contract == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: pnpm/action-setup@v6
        if: needs.scope.outputs.frontend_mode != 'none' || needs.scope.outputs.release_contract == 'true'
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        if: needs.scope.outputs.frontend_mode != 'none' || needs.scope.outputs.release_contract == 'true'
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install Linux desktop dependencies
        if: needs.scope.outputs.desktop_go_mode != 'none' || needs.scope.outputs.release_contract == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        if: needs.scope.outputs.frontend_mode != 'none' || needs.scope.outputs.release_contract == 'true'
        run: pnpm --dir desktop/frontend install --frozen-lockfile

      - name: Install Wails CLI
        if: >-
          needs.scope.outputs.frontend_mode == 'full' ||
          needs.scope.outputs.desktop_go_mode == 'full' ||
          needs.scope.outputs.release_contract == 'true'
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Generate frontend bindings
        if: needs.scope.outputs.frontend_mode == 'full'
        working-directory: desktop
        run: wails generate module

      - name: Check desktop module tidiness
        if: needs.scope.outputs.desktop_go_mode == 'full'
        working-directory: desktop
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "desktop/go.mod or go.sum is stale."
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Check desktop formatting
        if: needs.scope.outputs.desktop_go_mode != 'none'
        working-directory: desktop
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Proportional desktop Go gate
        if: needs.scope.outputs.desktop_go_mode != 'none'
        run: node scripts/pr-gate.mjs --base "${{ needs.scope.outputs.base_ref }}" --run desktop-go

      - name: golangci-lint
        if: needs.scope.outputs.desktop_go_mode != 'none'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: desktop
          args: --timeout=5m

      - name: Proportional frontend and packaging gate
        if: needs.scope.outputs.frontend_mode != 'none' || needs.scope.outputs.release_contract == 'true'
        run: node scripts/pr-gate.mjs --base "${{ needs.scope.outputs.base_ref }}" --run frontend

      - name: Install nfpm
        if: needs.scope.outputs.desktop_go_mode == 'full' || needs.scope.outputs.release_contract == 'true'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3

      - name: Linux release build
        if: needs.scope.outputs.desktop_go_mode == 'full' || needs.scope.outputs.release_contract == 'true'
        run: ./scripts/desktop-build.sh linux/amd64 v0.0.0 ci

  lint:
    needs: [scope, guard]
    if: needs.scope.outputs.root_go_mode != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  govulncheck:
    needs: [scope, guard]
    if: needs.scope.outputs.root_go_mode == 'full'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: govulncheck
        run: govulncheck ./...

  coverage:
    needs: [scope, guard]
    if: needs.scope.outputs.root_go_mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Full core coverage regression
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: upload coverage
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7
